  <!-- 引入自定义脚本 -->
  <script>
document.querySelectorAll('input[name="dataSource"]').forEach(radio => {
  radio.addEventListener('change', (e) => {
    const isItest = e.target.value === 'itest';

    // 切换显示字段
    document.querySelector('.itest-fields').style.display = isItest ? 'block' : 'none';
    document.querySelector('.manual-fields').style.display = isItest ? 'none' : 'block';
    document.querySelector('.time-fields').style.display = isItest ? 'none' : 'block';

    // 切换必填属性
    document.querySelectorAll('.itest-fields input, .itest-fields select').forEach(el => {
      el.disabled = !isItest;
      el.required = isItest;
    });
    document.querySelectorAll('.manual-fields input, .manual-fields select').forEach(el => {
      el.disabled = isItest;
      el.required = !isItest;
    });
    document.querySelectorAll('.time-fields input, .time-fields select').forEach(el => {
      el.disabled = isItest;
      el.required = !isItest;
    });

  });
});
</script>
  <script>
document.addEventListener('DOMContentLoaded', function() {
    const nameInput = document.getElementById('modalExecutorName');
    const daysInput = document.getElementById('modalExecutorDays');

    // 监听两个输入框的blur事件
    [nameInput, daysInput].forEach(input => {
        input.addEventListener('blur', async function() {
            if (nameInput.value && daysInput.value) {
                try {
                    const response = await fetch('/cal_target_di', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            executor_name: nameInput.value,
                            days: daysInput.value
                        })
                    });

                    const data = await response.json();

			var level1Input = row.find('input[data-field="Level1Issues"]').val();
			var level2Input = row.find('input[data-field="Level2Issues"]').val();
			var level3Input = row.find('input[data-field="Level3Issues"]').val();
			var level4Input = row.find('input[data-field="Level4Issues"]').val();
			var expectedIssuesInput = row.find('input[data-field="ExpectedIssues"]').val();
			var expectedDIInput = row.find('input[data-field="ExpectedDI"]').val();
			var actualDIInput = row.find('input[data-field="ActualDI"]').val();

			// Check if any input is empty or invalid
			if (!daysInput || !level1Input || !level2Input || !level3Input || !level4Input ||
				!expectedIssuesInput || !expectedDIInput || !actualDIInput) {
				console.log("One or more inputs are missing or invalid. Exiting function.");
				return;
			}

            var days = parseFloat(daysInput);

			var level1 = parseInt(level1Input);
			var level2 = parseInt(level2Input);
			var level3 = parseInt(level3Input);
			var level4 = parseInt(level4Input);
			var ExpectedIssues = parseInt(expectedIssuesInput);
			var ExpectedDI = parseFloat(expectedDIInput);
			var inputActualDI = parseFloat(actualDIInput);
            // 计算问题数总和
            var newActualIssues = level1 + level2 + level3 + level4;
            // 获取执行人 ID
            var executorId = row.find('input[data-executor-id]').data('executor-id');
            updateExecutors(executorId, 'Days', days);
            // 实时更新页面问题总数显示
            const totalIssues = document.querySelector(`input[data-executor-id="${executorId}"][readonly]`);
            // 更新值为新获取的值
            totalIssues.value = newActualIssues;
            var cachedRow; // 确保在函数外部声明，以便在回调中访问
            $.ajax({
              url: `/executor/${executorId}`, // 使用模板字符串插入 executorId
              method: 'GET',
              success: function (executor) {
                cachedRow = executor[0];
                //console.log('Executor details successfully fetched:', executor);
                if (cachedRow) {
                  if (cachedRow.Level1Issues !== level1 || cachedRow.Level2Issues !== level2 || cachedRow.Level3Issues !== level3 || cachedRow.Level4Issues !== level4) {
                    // 更新执行人问题数据到后端
                    if (typeof updateExecutorIssues === 'function') {
                      updateExecutorIssues({
                        executorId: executorId,
                        level1Issues: level1,
                        level2Issues: level2,
                        level3Issues: level3,
                        level4Issues: level4,
                        actualIssues: newActualIssues
                      });
                    } else {
                      console.error('updateExecutorIssues function is not defined');
                    }
                    let ProjectID = cachedRow.ProjectID;
                    // 检查 ProjectID 是否为 undefined
                    if (typeof ProjectID === 'undefined') {
                      console.error('ProjectID is undefined. Check the assignment of cachedRow.');
                    } else {
                      console.log('ProjectID is:', ProjectID);
                    }
                    let cachedExecutors;
                    $.ajax({
                      url: `/executors/${cachedRow.ProjectID}`,
                      method: 'GET',
                      success: function (executors) {
                        cachedExecutors = executors; // 确保 cachedExecutors 在合适的作用域中声明
                        //console.log('Executors details successfully fetched:', executors);
                        //console.log('ProjectID:', ProjectID, 'cachedExecutors:', cachedExecutors);
                        //更新当前执行人DI
                        const cachedProject = getcachedProjectRowById(ProjectID);
                        var newActualDI = 0;
                        if (cachedProject) {
                          let ConversionFactor = cachedProject.ConversionFactor;
                          newActualDI = (level1 * 10 + level2 * 3 + level3 * 1 + level4 * 0.5) * ConversionFactor;
                          newActualDI = parseFloat(newActualDI.toFixed(2));
                          // 在页面实时更新DI值
                          const actualDIInput = document.querySelector(`input[data-executor-id="${executorId}"][data-field="ActualDI"]`);
                          actualDIInput.value = newActualDI;
                          updateExecutors(executorId, 'ActualDI', newActualDI);
                        } else {
                          console.log('No cached row found with the given ProjectID');
                        }
                        //更新问题达标
                        let IsIssuesOnTarget = 0
                        let IsDIOnTarget = 0
                        let IsTargetIssuesOnTarget = 0
                        let IsTargetDIOnTarget = 0
                        for (let i = 0; i < cachedExecutors.length; i++) {
                          let ActualIssues
                          const currentExecutor = cachedExecutors[i];
                          const currentExecutorId = currentExecutor.ID; // 当前执行人的ID
                          if (cachedExecutors[i].ID === executorId) {
                            ActualIssues = newActualIssues
                          } else {
                            ActualIssues = cachedExecutors[i].ActualIssues
                          }
                          if (ActualIssues >= cachedProject.AverageIssues) {
                            IsIssuesOnTarget = 1
                            const getIsIssuesOnTarget = document.querySelector(`tr > td:nth-child(11) input[data-executor-id="${currentExecutorId}"]`);
                            getIsIssuesOnTarget.value = '是';
                            $(getIsIssuesOnTarget).css('color', 'green');
                            updateExecutors(cachedExecutors[i].ID, 'IsIssuesOnTarget', IsIssuesOnTarget);
                          } else {
                            IsIssuesOnTarget = 0
                            const getIsIssuesOnTarget = document.querySelector(`tr > td:nth-child(11) input[data-executor-id="${currentExecutorId}"]`);
                            getIsIssuesOnTarget.value = '否';
                            $(getIsIssuesOnTarget).css('color', 'red');
                            updateExecutors(cachedExecutors[i].ID, 'IsIssuesOnTarget', IsIssuesOnTarget);

                          }
                        }

                        //更新DI达标
                        for (let i = 0; i < cachedExecutors.length; i++) {
                          let ActualDI;
                          const currentExecutor = cachedExecutors[i];
                          const currentExecutorId = currentExecutor.ID; // 当前执行人的ID
                          if (cachedExecutors[i].ID === executorId) {
                            ActualDI = newActualDI
                          } else {
                            ActualDI = cachedExecutors[i].ActualDI
                          }
                          if (ActualDI >= cachedProject.AverageDI) {
                            IsDIOnTarget = 1
                            const getIsDIOnTarget = document.querySelector(`tr > td:nth-child(11) input[data-executor-id="${currentExecutorId}"]`);
                            getIsDIOnTarget.value = '是';
                            $(getIsDIOnTarget).css('color', 'green');
                            updateExecutors(cachedExecutors[i].ID, 'IsDIOnTarget', IsDIOnTarget);
                          } else {
                            IsDIOnTarget = 0
                            const getIsDIOnTarget = document.querySelector(`tr > td:nth-child(11) input[data-executor-id="${currentExecutorId}"]`);
                            getIsDIOnTarget.value = '否';
                            $(getIsDIOnTarget).css('color', 'red');
                            updateExecutors(cachedExecutors[i].ID, 'IsDIOnTarget', IsDIOnTarget);
                          }
                        }

                        //更新目标问题达标
                        if (newActualIssues >= cachedRow.ExpectedIssues) {
                          IsTargetIssuesOnTarget = 1
                          const getIsTargetIssuesOnTarget = document.querySelector(`tr > td:nth-child(13) input[data-executor-id="${executorId}"]`);
                            getIsTargetIssuesOnTarget.value = '是';
                            $(getIsTargetIssuesOnTarget).css('color', 'green');
                          updateExecutors(executorId, 'IsTargetIssuesOnTarget', IsTargetIssuesOnTarget);
                        } else {
                          const getIsTargetIssuesOnTarget = document.querySelector(`tr > td:nth-child(13) input[data-executor-id="${executorId}"]`);
                            getIsTargetIssuesOnTarget.value = '否';
                            $(getIsTargetIssuesOnTarget).css('color', 'red');
                          updateExecutors(executorId, 'IsTargetIssuesOnTarget', IsTargetIssuesOnTarget);
                        }
                        //更新目标DI达标
                        if (newActualDI >= cachedRow.ExpectedDI) {
                          IsTargetDIOnTarget = 1
                          const getIsTargetDIOnTarget = document.querySelector(`tr > td:nth-child(14) input[data-executor-id="${executorId}"]`);
                            getIsTargetDIOnTarget.value = '是';
                            $(getIsTargetDIOnTarget).css('color', 'green');
                          updateExecutors(executorId, 'IsTargetDIOnTarget', IsTargetDIOnTarget);
                        } else {
                          const getIsTargetDIOnTarget = document.querySelector(`tr > td:nth-child(14) input[data-executor-id="${executorId}"]`);
                            getIsTargetDIOnTarget.value = '否';
                            $(getIsTargetDIOnTarget).css('color', 'red');
                          updateExecutors(executorId, 'IsTargetDIOnTarget', IsTargetDIOnTarget);
                        }
                      },
                      error: function (jqXHR, textStatus, errorThrown) {
                        console.error('Error fetching executors details:', textStatus, errorThrown);
                      }
                    });
                  }
                  //修改执行人预期问题数和预期DI
                  if (cachedRow.ExpectedIssues !== ExpectedIssues || cachedRow.ExpectedDI !== ExpectedDI) {
                    updateExecutors(executorId, 'ExpectedIssues', ExpectedIssues);
                    updateExecutors(executorId, 'ExpectedDI', ExpectedDI);

                    // 发送请求记录预期值修改状态
                    $.ajax({
                        url: '/record_expected_update',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({
                            projectID: cachedRow.ProjectID,
                            executorID: executorId,
                            updateExpected: 1
                        }),
                        success: function() {
                            console.log('预期值修改状态已记录');
                        },
                        error: function() {
                            console.error('记录预期值修改状态失败');
                        }
                    });

                    //更新预期目标问题达标
                    let IsTargetIssuesOnTarget = 0
                    if (cachedRow.ActualIssues >= ExpectedIssues) {
                      IsTargetIssuesOnTarget = 1
                      updateExecutors(executorId, 'IsTargetIssuesOnTarget', IsTargetIssuesOnTarget);
                    } else {
                      IsTargetIssuesOnTarget = 0
                      updateExecutors(executorId, 'IsTargetIssuesOnTarget', IsTargetIssuesOnTarget);
                    }
                    //更新目标DI达标
                    let IsTargetDIOnTarget = 0
                    if (cachedRow.ActualDI >= ExpectedDI) {
                      IsTargetDIOnTarget = 1
                      updateExecutors(executorId, 'IsTargetDIOnTarget', IsTargetDIOnTarget);
                    } else {
                      IsTargetDIOnTarget = 0
                      updateExecutors(executorId, 'IsTargetDIOnTarget', IsTargetDIOnTarget);
                    }
                  }
                  //手工修改执行人的实际DI
                  if (cachedRow.ActualDI !== inputActualDI) {
				    console.error("手工修改执行人的实际DI:inputActualDI", inputActualDI);

                    updateExecutors(executorId, 'ActualDI', inputActualDI);
                    // 缓存及时更新
                    cachedRow.ActualDI = inputActualDI;
                    //更新目标DI达标
                    let IsTargetDIOnTarget = 0
                    if (inputActualDI >= cachedRow.ExpectedDI) {
                      IsTargetDIOnTarget = 1
                      updateExecutors(executorId, 'IsTargetDIOnTarget', IsTargetDIOnTarget);
                    } else {
                      IsTargetDIOnTarget = 0
                      updateExecutors(executorId, 'IsTargetDIOnTarget', IsTargetDIOnTarget);
                    }
					//更新DI达标
					const cachedProject = getcachedProjectRowById(cachedRow.ProjectID);
					let IsDIOnTarget = 0
					if (cachedProject) {
					  if (inputActualDI >= cachedProject.AverageDI){
					    IsDIOnTarget = 1
					    updateExecutors(executorId, 'IsDIOnTarget', IsDIOnTarget);
					  } else {
					    IsDIOnTarget = 0
					    updateExecutors(executorId, 'IsDIOnTarget', IsDIOnTarget);
					  }

					} else {
					  console.log('No cached row found with the given ProjectID');
					}


                  }

                }
              },
              error: function (jqXHR, textStatus, errorThrown) {
                console.error('Error fetching executor details:', textStatus, errorThrown);
              },
              error: function (jqXHR, textStatus, errorThrown) {
                console.error('Error fetching executor details:', textStatus, errorThrown);
              }
            });

          }


          // 更新执行人字段(一般方法)
          updateExecutors = function (id, field, value) {

            //console.log('Updating Executors for ID:', id, 'to', value);
            $.ajax({
              url: '/update_executor',
              method: 'POST',
              contentType: 'application/json',
              data: JSON.stringify({ id: id, column: field, value: value }),
              success: function () {
                layer.msg('执行人相关字段已更新', { icon: 1, time: 2000 });
              },
              error: function () {
                layer.msg('更新执行人相关字段失败，请重试', { icon: 2, time: 2000 });
              }
            });
          };
          // 定义更新执行人问题数的 AJAX 请求
          function updateExecutorIssues(data) {
           // console.log('Updating executor issues:', data);
            $.ajax({
              url: '/update_executor_issues', // 后端 API 路径
              method: 'POST',
              contentType: 'application/json',
              data: JSON.stringify(data), // 发送所有字段到后端
              success: function () {
                layer.msg('问题数已更新', { icon: 1, time: 2000 });
                var rowDataID = parseInt(data.executorId, 10); // 确保值为整数
              },
              error: function () {
                layer.msg('问题数更新失败，请重试', { icon: 2, time: 2000 });
              }
            });
          }

          fetchDataAndRenderTable();
          // 更新测试组的函数
          function updateTestGroup(id, value) {
            //console.log(`更新测试组 - 行ID: ${id}, 新值: ${value}`);
            // 在这里处理 TestGroup 的更改逻辑
            $.ajax({
              url: '/update_test_group',
              method: 'POST',
              contentType: 'application/json',
              data: JSON.stringify({ id: id, testGroup: value }),
              success: function () {
                layer.msg('测试组已更新', { icon: 1, time: 2000 });
                fetchDataAndRenderTable()
              },
              error: function () {
                layer.msg('更新测试组失败，请重试', { icon: 2, time: 2000 });
              }
            });
          }
          // 更新项目的执行人数的函数
          function update_head_counts(projectID, count) {
            //console.log(`更新项目的执行人数 - 行ID: ${projectID}, 新值: ${count}`);
            // 在这里处理 HeadCounts 的更改逻辑
            $.ajax({
              url: '/update_head_counts',
              method: 'POST',
              contentType: 'application/json',
              data: JSON.stringify({ projectID: projectID, count: count }),
              success: function () {
              //  layer.msg('测试执行人数已更新', { icon: 1, time: 2000 });
              },
              error: function () {
                layer.msg('更新测试执行人数失败，请重试', { icon: 2, time: 2000 });
              }
            });
          }
      });
    });

    // 刷新所有项目按钮点击事件
    $('#refreshAllBtn').on('click', function() {
      layer.confirm('确定要刷新所有项目数据吗？此操作可能需要一些时间', {icon: 3, title: '确认刷新'}, function(index) {
        layer.load(1, {shade: [0.1,'#fff']}); // 显示加载动画
<!--        // 获取所有项目ID的正确方式-->
<!--        const projects = projectCache.get();-->
<!--        const projectIDs = projects ? projects.map(project => project.ID) : [];-->

<!--        console.log('准备刷新的项目ID:', projectIDs); // 调试用-->

        $.ajax({
          url: '/refresh_all_projects',
          method: 'POST',
<!--          data: JSON.stringify({ projectIDs: projectIDs }),-->
          success: function() {
            layer.closeAll();
            layer.msg('所有项目数据已刷新', {icon: 1, time: 2000});
<!--            fetchDataAndRenderTable(); // 重新加载数据-->
            layui.table.reload('projectboard');
          },
          error: function() {
            layer.closeAll();
            layer.msg('刷新失败，请重试', {icon: 2, time: 2000});
          }
        });

        layer.close(index);
      });
    });

  </script>
