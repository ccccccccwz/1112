<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>项目绩效管理</title>
  <!-- 引入 LayUI 样式 -->
  <link href="{{ url_for('static', filename='src/css/layui.css') }}" rel="stylesheet" media="all"/>
  <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet" media="all"/>
  <style>
    .expand-btn {
      cursor: pointer;
      display: inline-block;
      width: 16px;
      height: 16px;
      text-align: center;
      line-height: 16px;
      border-radius: 2px;
      background-color: #f2f2f2;
    }
    .search-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin: 20px;
    }
    .search-item {
      margin-right: 20px;
      margin-bottom: 20px;
    }
    .header-add-btn-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    .header-add-btn {
      cursor: pointer;
      padding: 8px 0;
      background-color: #dcdcdc;
      color: #000;
      border-radius: 4px;
      text-align: center;
      width: 120px;
      box-sizing: border-box;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.4);
    }
    .modal-content {
      background-color: #fefefe;
      margin: 15% auto;
      padding: 15px;
      border: 1px solid #888;
      width: 80%;
      max-width: 400px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      border-radius: 8px;
    }
    .close, .close-executor {
      color: #aaa;
      float: right;
      font-size: 24px;
      font-weight: bold;
    }
    .close:hover, .close:focus, .close-executor:hover, .close-executor:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
    }
    .form-group select, .form-group input {
      width: calc(100% - 16px);
      padding: 6px;
      box-sizing: border-box;
    }
    .layui-table-cell {
      overflow: visible;
      padding: 0;
      text-align: center;
      vertical-align: middle;
    }
    .layui-btn {
      margin: 2px 0;
    }
    select.layui-input {
      width: 100%;
      height: 38px;
      line-height: 38px;
      padding: 0 10px;
      box-sizing: border-box;
      border: none;
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      position: relative;
      z-index: 10; /* 确保下拉菜单在其他元素之上 */
    }
    .flex-container {
      display: flex;
      align-items: center;
      height: 100%;
      width: 100%;
      position: relative; /* 确保子元素可以绝对定位 */
    }
    .expand-row td {
      padding-left: 100px;
      background-color: #f9f9f9;
    }
    .expand-row table {
      width: calc(100% - 100px);
      margin-left: 100px;
    }
    #projectboard {
      max-height: 500px; /* 控制表格最大高度 */
      overflow-y: auto; /* 仅在表格上滚动 */
    }
    /* 应用到子表输入框 */
    .child-table-input {
      border: none; /* 确保边框颜色一致 */
      padding: none; /* 确保内边距一致 */
      box-sizing: border-box; /* 确保内边距和边框不影响元素的最终大小 */
      height: 22px; /* 确保高度一致 */
      line-height: 22px; /* 确保行高一致 */
      width: 50px; /* 根据需要设置宽度 */
      text-align: center; /* 居中文本 */
    }
    /* 应用到子表输入框 */
    .child-table-name-input {
      border: none; /* 确保边框颜色一致 */
      padding: none; /* 确保内边距一致 */
      box-sizing: border-box; /* 确保内边距和边框不影响元素的最终大小 */
      height: 30px; /* 确保高度一致 */
      line-height: 30px; /* 确保行高一致 */
      width: 100px; /* 根据需要设置宽度 */
      text-align: center; /* 居中文本 */
    }
    /* 可编辑输入框通用样式 */
    .input-no-border {
      border: none; /* 无边框 */
      padding: none; /* 内边距 */
      box-sizing: border-box; /* 确保内边距不影响元素大小 */
      height: 30px; /* 输入框高度 */
      line-height: 30px; /* 行高 */
      text-align: center; /* 居中对齐 */
      background-color: transparent; /* 背景透明 */
    }

    /* 当输入框获得焦点时的样式 */
    .input-no-border:focus {
      outline: none; /* 去掉聚焦时的外边框 */
      background-color: #f5f5f5; /* 可选：修改聚焦时的背景颜色 */
    }
    .project-name-cell {
      text-align: left;
      padding-left: 10px; /* 增加左边距 */
      white-space: normal; /* 允许换行 */
      word-wrap: break-word; /* 长单词自动换行 */
      line-height: 1.3; /* 设置行高以增加可读性 */
    }
    /* 确保表格单元格的按钮完全对齐 */
    .layui-table td {
        padding: 0 !important; /* 移除表格单元格的默认内边距 */
    }

    .layui-table .dropdown-btn {
        display: flex; /* 使用 flex 布局 */
        justify-content: center; /* 水平居中 */
        align-items: center; /* 垂直居中 */
        width: 100%; /* 按钮宽度占满 */
        height: 100%; /* 按钮高度占满 */
        line-height: normal;
        padding: 0;
        border: none;
        background-color: transparent;
        cursor: pointer;
        box-sizing: border-box;
    }

    /* 鼠标悬停时按钮背景变化 */
    .layui-table .dropdown-btn:hover {
        background-color: #f2f2f2;
    }

    /* 自定义下拉菜单的样式 */
    .layui-dropdown-menu {
        text-align: center; /* 水平居中 */
    }

    /* 确保下拉菜单项的文字居中 */
    .layui-dropdown-menu li a {
        display: flex; /* 使用 flex 布局 */
        justify-content: center; /* 水平居中 */
        align-items: center; /* 垂直居中 */
        height: 40px; /* 确保高度一致 */
        line-height: normal;
        padding: 0; /* 去掉多余内边距 */
    }
    /* 隐藏<input type="number">的上下箭头按钮 */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    /* Firefox */
    input[type=number] {
        -moz-appearance: textfield;
    }


  </style>
</head>
<body>
  <div class="search-container">
    <div class="search-item">
      <select id="testgroupSelect" class="layui-select" aria-label="选择测试组">
        <option value="">请选择测试组</option>
        <option value="路由">路由</option>
        <option value="交换">交换</option>
        <option value="安全">安全</option>
      </select>
    </div>
    <div class="search-item">
      <select id="projectlevelSelect" class="layui-select" aria-label="选择项目级别">
        <option value="">请选择项目级别</option>
        <option value="重要">重要</option>
        <option value="普通">普通</option>
      </select>
    </div>
    <div class="search-item">
      <select id="projectstatusSelect" class="layui-select" aria-label="选择项目状态">
        <option value="">请选择项目状态</option>
        <option value="进行中">进行中</option>
        <option value="已完成">已完成</option>
      </select>
    </div>
    <div class="search-item">
      <input type="text" id="projectnameInput" placeholder="请输入项目名" class="layui-input" aria-label="项目名">
    </div>
    <div class="search-item">
      <button id="searchBtn" class="layui-btn layui-btn-primary">搜索</button>
    </div>
    <div class="search-item">
      <button id="resetBtn" class="layui-btn layui-btn-primary">重置</button>
    </div>
  </div>

  <div id="projectboard-container">
    <table id="projectboard" lay-filter="projectboard"></table>
  </div>

  <div id="myModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <span class="close" aria-label="关闭">&times;</span>
      <h3>新项目</h3>
      <form id="addForm">
        <div class="form-group">
          <label for="modalTestgroup">测试组:</label>
          <select id="modalTestgroup" required>
            <option value="">请选择测试组</option>
            <option value="路由">路由</option>
            <option value="交换">交换</option>
            <option value="安全">安全</option>
          </select>
        </div>
        <div class="form-group">
          <label for="modalProjectname">项目名:</label>
          <input type="text" id="modalProjectname" required>
        </div>
        <div class="form-group">
          <label for="modalConversionFactor">项目系数:</label>
          <input type="number" id="modalConversionFactor" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="modalProjectlevel">项目级别:</label>
          <select id="modalProjectlevel" required>
            <option value="">请选择项目级别</option>
            <option value="重要">重要</option>
            <option value="普通">普通</option>
          </select>
        </div>
        <div class="form-group">
          <label for="modalExpectnum">预期问题数:</label>
          <input type="number" id="modalExpectnum" required>
        </div>
        <div class="form-group">
          <label for="modalExpectdi">预期DI:</label>
          <input type="number" id="modalExpectdi" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="modalStartime">开始日期:</label>
          <input type="date" id="modalStartime" required>
        </div>
        <button type="submit" style="margin-top: 10px;">提交</button>
      </form>
    </div>
  </div>

  <!-- Executor Modal -->
  <div id="executorModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <span class="close-executor" aria-label="关闭执行人窗口">&times;</span>
      <h3>新增执行人</h3>
      <form id="addExecutorForm">
        <div class="form-group">
          <label for="modalExecutorName">执行人姓名:</label>
          <input type="text" id="modalExecutorName" required>
        </div>
        <div class="form-group">
          <label for="modalExecutorExpectedIssues">目标问题数:</label>
          <input type="number" id="modalExecutorExpectedIssues" required>
        </div>
        <div class="form-group">
          <label for="modalExecutorExpectedDI">目标DI:</label>
          <input type="number" id="modalExecutorExpectedDI" step="0.01" required>
        </div>
        <input type="hidden" id="modalProjectID">
        <button type="submit" style="margin-top: 10px;">提交</button>
      </form>
    </div>
  </div>

  <!-- 引入 jQuery 和 LayUI -->
  <script src="{{ url_for('static', filename='jquery-3.6.0.min.js') }}"></script>
  <script src="{{ url_for('static', filename='src/layui.js') }}"></script>
  <!-- 引入自定义脚本 -->
  <script>
    //缓存执行人数据
    const executorCache = (function() {
      let cachedExecutors = null; // 局部变量，外部无法直接访问

      return {
        get: function() {
          return cachedExecutors;
        },
        set: function(newData) {
          cachedExecutors = newData;
        }
      };
    })();
    // 获取特定 ID 的行数据
    function getcachedExecutorRowById(id) {
      cachedExecutors = executorCache.get();
      for (let i = 0; i < cachedExecutors.length; i++) {
        if (cachedExecutors[i].ID === id) {
          return cachedExecutors[i];
        }
      }
      return null; // 如果没有找到匹配的 ID，返回 null
    }
    // 使用
    //executorCache.set(executors); // 设置新的缓存数据
    //console.log(executorCache.get()); // 获取缓存数据

    //缓存全部项目数据
    const projectCache = (function() {
      let cachedProjects = null; // 局部变量，外部无法直接访问

      return {
        get: function() {
          return cachedProjects;
        },
        set: function(newData) {
          cachedProjects = newData;
        }
      };
    })();
    // 获取特定 ID 的行数据
    function getcachedProjectRowById(id) {
      cachedProjects = projectCache.get();
      for (let i = 0; i < cachedProjects.length; i++) {
        if (cachedProjects[i].ID === id) {
          return cachedProjects[i];
        }
      }
      return null; // 如果没有找到匹配的 ID，返回 null
    }
    // 使用
    //projectCache.set(projects); // 设置新的缓存数据
    //console.log(projectCache.get()); // 获取缓存数据
    $(document).ready(function() {
      layui.use(['table', 'laydate', 'layer','dropdown'], function() {
        var table = layui.table;
        var laydate = layui.laydate;
        var layer = layui.layer;
        var dropdown = layui.dropdown;

        function fetchDataAndRenderTable() {
          $.ajax({
            url: '/projects',
            method: 'GET',
            success: function(data) {
              if (Array.isArray(data) && data.length > 0) {
                projectCache.set(data)
                renderTable(data);
              } else {
                console.error('Data format is incorrect or empty');
                layer.msg('数据库中尚未添加数据', { icon: 2, time: 2000 });
                renderTable([]);
              }
            },
            error: function() {
              layer.msg('Failed to fetch data from server', { icon: 2, time: 2000 });
              renderTable([]);
            }
          });
        }
        
        function renderTable(data) {
          table.render({
            elem: '#projectboard',
            data: data,
            page: true, // 启用分页
            limit: 10, // 每页显示的条数
            limits: [10, 20, 30, 50], // 可供选择的每页条数选项
            cols: [[
              {field: 'expand', title: '<div class="header-add-btn-container"><div class="header-add-btn" id="addBtn">新项目</div></div>', width: 60, templet: function(){
                return '<div class="expand-btn layui-icon layui-icon-right"></div>';
              }},
              {field: 'TestGroup', title: '测试组', width: 110, templet: function(d) {
                return `<button class="layui-btn layui-btn-primary dropdown-btn" data-id="${d.ID}" data-type="testGroup">${d.TestGroup}</button>`;
              }},
              {field: 'ProjectName', title: '项目名', width: 508, edit: 'text', templet: function(d) {
                return `<div class="project-name-cell">${d.ProjectName}</div>`;
              }},
              {field: 'ConversionFactor', title: '项目系数', width: 80, edit: 'text'},
              {field: 'ProjectLevel', title: '项目级别', width: 80, templet: function(d) {
                return `<button class="layui-btn layui-btn-primary dropdown-btn" data-id="${d.ID}" data-type="ProjectLevel">${d.ProjectLevel}</button>`;
              }},
              {field: 'HeadCounts', title: '测试人数', width: 72},
              {field: 'ExpectedIssues', title: '预期问题数', width: 85, edit: 'text'},
              {field: 'ExpectedDI', title: '预期DI', width: 100, edit: 'text'},
              {field: 'AverageIssues', title: '问题均数', width: 100},
              {field: 'AverageDI', title: 'DI均值', width: 60},
              {field: 'StartDate', title: '开始日期', width: 90, templet: function(d){
                return `<input type="text" class="layui-input date-picker" data-id="${d.ID}" value="${d.StartDate}" />`;
              }},
              {field: 'Status', title: '项目状态', width: 85, templet: function(d) {
                return `<button class="layui-btn layui-btn-primary dropdown-btn" data-id="${d.ID}" data-type="status">${d.Status}</button>`;
              }},
              {field: 'operations', title: '操作', width: 130, templet: function(){
                return '<button class="layui-btn layui-btn-danger layui-btn-xs delete-btn">删除</button>' +
                       '<button class="layui-btn layui-btn-normal layui-btn-xs add-executor-btn">新增执行人</button>';
              }}
            ]],
            height: 'full-200', // 自动调整表格高度以适应窗口
            done: function() {
                // 为每一列（测试组）的按钮创建下拉菜单
                $('.dropdown-btn').each(function() {
                    const id = $(this).data('id');
                    const type = $(this).data('type');

                    // 判断是哪个列的下拉菜单
                    if (type === 'testGroup') {
                        dropdown.render({
                            elem: this,
                            align: 'center',
                            data: [
                                {title: '路由', id: 1},
                                {title: '交换', id: 2},
                                {title: '安全', id: 3}
                            ],
                            click: function(obj) {
                                updateTestGroup(id, obj.title);
                               // layer.tips('选择了：' + obj.title, obj.elem, {tips: [1, '#5FB878']});
                            }
                        });
                    } else if (type === 'ProjectLevel') {
                        dropdown.render({
                            elem: this,
                            align: 'center',
                            data: [
                                {title: '重要', id: 1},
                                {title: '普通', id: 2},
                            ],
                            click: function(obj) {
                                updateProjectLevel(id, obj.title);
                             //   layer.tips('选择了：' + obj.title, obj.elem, {tips: [1, '#5FB878']});
                            }
                        });
                    } else if (type === 'status') {
                        dropdown.render({
                            elem: this,
                            align: 'center',
                            data: [
                                {title: '进行中', id: 1},
                                {title: '已完成', id: 2}
                            ],
                            click: function(obj) {
                                updateProjectStatus(id, obj.title);
                              //  layer.tips('选择了：' + obj.title, obj.elem, {tips: [1, '#5FB878']});
                            }
                        });
                    }
                });
            }
          });


          // Initialize the date picker for each date input
          setTimeout(function() {
            $('.date-picker').each(function() {
              laydate.render({
                elem: this,
                type: 'date',
                showClear: false,
                trigger: 'click',
                done: function(value, date, endDate) {
                  var id = $(this.elem).data('id');
                  updateStartDate(id, value);
                }
              });
            });
          }, 0);
          // Update start date function
          function updateStartDate(id, value) {
            console.log('Updating start date for ID:', id, 'to', value);
            // Send an AJAX request to update the start date
            $.ajax({
              url: '/update_project_start_date',
              method: 'POST',
              contentType: 'application/json',
              data: JSON.stringify({ id: id, startDate: value }),
              success: function() {
                layer.msg('开始日期已更新', { icon: 1, time: 2000 });
              },
              error: function() {
                layer.msg('更新开始日期失败，请重试', { icon: 2, time: 2000 });
              }
            });
          }

          // 监听单元格编辑事件
          table.on('edit(projectboard)', function(obj){
            var value = obj.value; // 得到修改后的值
            var data = obj.data; // 得到所在行所有键值
            var field = obj.field; // 得到字段
            //layer.msg('[ID: '+ data.ID +'] ' + field + ' 字段更改值为：'+ value);
            updateProject(data.ID,field,value)
          });

          // Event delegation for delete and add executor buttons
          $('.layui-table-body').on('click', '.delete-btn', function() {
            var index = $(this).closest('tr').data('index');
            var rowData = data[index];
            layer.confirm('删除操作不能恢复，请确认是否删除？', { icon: 3, title: '确认删除' }, function(index) {
              $.ajax({
                url: '/delete_project',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ id: rowData.ID }),
                success: function() {
                  layer.msg('项目已删除', { icon: 1, time: 2000 });
                  fetchDataAndRenderTable();
                },
                error: function() {
                  layer.msg('删除项目失败', { icon: 2, time: 2000 });
                }
              });
              layer.close(index);
            });
          });


          $('.layui-table-body').on('click', '.add-executor-btn', function() {
            var index = $(this).closest('tr').data('index');
            var rowData = data[index];
            $('#modalProjectID').val(rowData.ID);
            $('#executorModal').show();
          });

          // Expand child table
          $('.layui-table-body').on('click', '.expand-btn', function() {
            var tr = $(this).closest('tr'); // 获取当前行
            var dataIndex = tr.attr('data-index'); // 获取当前行的索引
            var rowData = data[dataIndex]; // 获取当前行的数据
            var tbodySelector = tr.next().find('tbody'); // 找到下一个 tr 中的 tbody

            if (tr.next().hasClass('expand-row')) {
              // 如果已经展开，点击后收起子表
              tr.next().remove();
              $(this).removeClass('layui-icon-down').addClass('layui-icon-right');
            } else {
              // 如果未展开，点击后展开子表
              $.ajax({
                url: `/executors/${rowData.ID}`, // 根据行数据ID获取详情
                method: 'GET',
                success: function(executors) {
                  executorCache.set(executors); 
                  if (executors.length === 0) {
                    layer.msg('请给项目添加执行人', { icon: 0, time: 2000 });
                    return;
                  }
                  // 构建子表的HTML结构
                  var executorRows = executors.map(function(executor) {
                    return `<tr>
                              <td style="width: 110px; border: 1px solid #ddd; padding: 8px; text-align: center;">
                                <input type="text" value="${executor.ExecutorName}" class="child-table-name-input input-no-border"
                                       data-executor-id="${executor.ID}" />
                              </td>
                              <td style="width: 90px; border: 1px solid #ddd; padding: 8px; text-align: center;">
                                <input type="number" value="${executor.ExpectedIssues}" class="child-table-input input-no-border"
                                       data-executor-id="${executor.ID}" min="0" />
                              </td>
                              <td style="width: 80px; border: 1px solid #ddd; padding: 8px; text-align: center;">
                                <input type="number" step="0.01" value="${executor.ExpectedDI}" class="child-table-input input-no-border"
                                       data-executor-id="${executor.ID}" min="0" />
                              </td>
                              <td style="width: 85px; border: 1px solid #ddd; padding: 8px; text-align: center;">
                                <input type="number" value="${executor.ActualIssues}" class="child-table-input input-no-border"
                                       data-executor-id="${executor.ID}" min="0" readonly />
                              </td>
                              <td style="width: 85px; border: 1px solid #ddd; padding: 8px; text-align: center;">

        // 更新逻辑封装为一个函数
        function handleInputUpdate(inputElement) {
          var row = inputElement.closest('tr'); // 获取当前输入框所在的行
          console.log('executorCache row:',executorCache.get())

          // 使用 data-field 属性选择输入框并获取值
          var level1 = parseInt(row.find('input[data-field="Level1Issues"]').val()) || 0;
          var level2 = parseInt(row.find('input[data-field="Level2Issues"]').val()) || 0;
          var level3 = parseInt(row.find('input[data-field="Level3Issues"]').val()) || 0;
          var level4 = parseInt(row.find('input[data-field="Level4Issues"]').val()) || 0;
          //var ActualIssues = parseInt(row.find('input[data-field="ActualIssues"]').val()) || 0;

          // 计算问题数总和
          var newActualIssues = level1 + level2 + level3 + level4;
          console.log(
            'level1:', level1,
            'level2:', level2,
            'level3:', level3,
            'level4:', level4,
            'newActualIssues:', newActualIssues
          );

          // 更新当前数据到页面
          //row.find('input[data-field="ActualIssues"]').val(newActualIssues);

          // 获取执行人 ID
          var executorId = row.find('input[data-executor-id]').data('executor-id');
          console.log('Executor ID:', executorId);

          const cachedRow = getcachedExecutorRowById(executorId);
          if (cachedRow) {
            console.log('Found cached row:', cachedRow);
            if (cachedRow.Level1Issues !== level1 || cachedRow.Level2Issues !== level2 || cachedRow.Level3Issues !== level3 || cachedRow.Level4Issues !== level4) {
              // 更新执行人问题数据到后端
              if (typeof updateExecutorIssues === 'function') {
                updateExecutorIssues({
                  executorId: executorId,
                  level1Issues: level1,
                  level2Issues: level2,
                  level3Issues: level3,
                  level4Issues: level4,
                  actualIssues: newActualIssues
                });
              } else {
                console.error('updateExecutorIssues function is not defined');
              }
              ProjectID = cachedRow.ProjectID;
              cachedExecutors = executorCache.get();
              //更新项目问题均数
              var ProjectIssues = 0;
              for (let i = 0; i < cachedExecutors.length; i++) {
                if (cachedExecutors[i].ID === executorId) {
                  ProjectIssues += newActualIssues;
                } else {
                  ProjectIssues += cachedExecutors[i].ActualIssues;
                }
              }
              var ExecutorsNumber = cachedExecutors.length;
              var newAverageIssues = Math.trunc(ProjectIssues/ExecutorsNumber);
              updateProject(ProjectID,'AverageIssues',newAverageIssues);
              //更新当前执行人DI
              const cachedProject = getcachedProjectRowById(ProjectID);
              var newActualDI = 0;
              if (cachedProject) {
                let ConversionFactor = cachedProject.ConversionFactor;
                newActualDI = (level1*10 + level2*3 + level3*1 + level4*0.5)*ConversionFactor;
                newActualDI = parseFloat(newActualDI.toFixed(2));
                updateExecutors(executorId,'ActualDI',newActualDI);

              } else {
                  console.log('No cached row found with the given ID');
              }
              //更新项目的DI均值
              var ProjectDI = 0
              for (let i = 0; i < cachedExecutors.length; i++) {
                if (cachedExecutors[i].ID === executorId) {
                  ProjectDI += newActualDI;
                } else {
                  ProjectDI += cachedExecutors[i].ActualDI;
                }
              }
              var newAverageDI = ProjectDI / ExecutorsNumber;
              newAverageDI = newAverageDI.toFixed(2);
              updateProject(ProjectID,'AverageDI',newAverageDI);
              let IsIssuesOnTarget = 0
              let IsDIOnTarget = 0
              let IsTargetIssuesOnTarget = 0
              let IsTargetDIOnTarget = 0
              //更新问题达标
              for (let i = 0; i < cachedExecutors.length; i++) {
                let ActualIssues 
                if (cachedExecutors[i].ID === executorId) {
                  ActualIssues = newActualIssues
                } else {
                  ActualIssues = cachedExecutors[i].ActualIssues
                }
                if (ActualIssues >= newAverageIssues) {
                  IsIssuesOnTarget = 1
                  updateExecutors(cachedExecutors[i].ID,'IsIssuesOnTarget',IsIssuesOnTarget);
                  console.log('updateExecutors:', {
                  IsIssuesOnTarget: IsIssuesOnTarget,
                  ActualIssues: ActualIssues,
                  newAverageIssues: newAverageIssues
                  });
                } else {
                  IsIssuesOnTarget = 0
                  updateExecutors(cachedExecutors[i].ID,'IsIssuesOnTarget',IsIssuesOnTarget);
                  console.log('updateExecutors:', {
                  IsIssuesOnTarget: IsIssuesOnTarget,
                  ActualIssues: ActualIssues,
                  newAverageIssues: newAverageIssues
                  });
                }
              }
              
              //更新DI达标
              for (let i = 0; i < cachedExecutors.length; i++) {
                let ActualDI
                if (cachedExecutors[i].ID === executorId) {
                  ActualDI = newActualDI
                } else {
                  ActualDI = cachedExecutors[i].ActualDI
                }
                if (ActualDI >= newAverageDI) {
                  IsDIOnTarget = 1
                  updateExecutors(cachedExecutors[i].ID,'IsDIOnTarget',IsDIOnTarget);
                  console.log('updateExecutors:', {
                  executorId:executorId,
                  IsDIOnTarget: IsDIOnTarget,
                  ActualDI: ActualDI,
                  newAverageDI: newAverageDI
                });
                } else {
                  IsDIOnTarget = 0
                  updateExecutors(cachedExecutors[i].ID,'IsDIOnTarget',IsDIOnTarget);
                  console.log('updateExecutors:', {
                  executorId:executorId,
                  IsDIOnTarget: IsDIOnTarget,
                  ActualDI: ActualDI,
                  newAverageDI: newAverageDI
                });
                }
              }

              //更新目标问题达标
              if (newActualIssues >= cachedRow.ExpectedIssues) {
                IsTargetIssuesOnTarget = 1
                updateExecutors(executorId,'IsTargetIssuesOnTarget',IsTargetIssuesOnTarget);
              } else {
                updateExecutors(executorId,'IsTargetIssuesOnTarget',IsTargetIssuesOnTarget);
              }
              //更新目标DI达标
              if (newActualDI >= cachedRow.ExpectedDI) {
                IsTargetDIOnTarget = 1
                updateExecutors(executorId,'IsTargetDIOnTarget',IsTargetDIOnTarget);
              } else {
                updateExecutors(executorId,'IsTargetDIOnTarget',IsTargetDIOnTarget);
              }
              fetchDataAndRenderTable(); // 重新刷新数据表
            }
          } else {
            console.log('No cached row found with the given ID');
          }
        }
