<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>绩效管理</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* 防止出现滚动条 */
    }
    .container-fluid {
      height: 100vh; /* 设定高度为视口高度 */
      display: flex;
      flex-direction: column;
    }
    .content {
      display: none;
      flex: 1;
      overflow: hidden;
    }
    .active {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .divider {
      border-top: 5px solid green;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <h2 class="text-center">绩效管理</h2>
    <!-- 功能按钮 -->
    <div class="d-flex justify-content-start">
      <button class="btn btn-primary mx-2" onclick="showContent('feature1')">项目绩效管理</button>
      <button class="btn btn-primary mx-2" onclick="showContent('feature2')">个人绩效管理</button>
    </div>

    <!-- 分割线 -->
    <div class="divider"></div>

    <!-- 内容区域 -->
    <div id="feature1" class="content">
      <h3>项目绩效管理</h3>
      <iframe src="chart"></iframe>
    </div>

    <div id="feature2" class="content">
      <h3>个人绩效管理</h3>
      <p>这里是功能 2 的内容。</p>
    </div>
  </div>

  <script>
    function showContent(id) {
      // 隐藏所有内容
      var contents = document.querySelectorAll('.content');
      contents.forEach(function(content) {
        content.classList.remove('active');
      });

      // 显示选中的内容
      var selectedContent = document.getElementById(id);
      if (selectedContent) {
        selectedContent.classList.add('active');
      }
    }
  </script>
</body>
</html>
