<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>项目绩效管理</title>
  <!-- 引入 LayUI 样式 -->
  <link href="{{ url_for('static', filename='src/css/layui.css') }}" rel="stylesheet" media="all"/>
  <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet" media="all"/>
  <style>
    .expand-btn {
      cursor: pointer;
      display: inline-block;
      width: 16px;
      height: 16px;
      text-align: center;
      line-height: 16px;
      border-radius: 2px;
      background-color: #f2f2f2;
    }
    .search-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin: 20px;
    }
    .search-item {
      margin-right: 20px;
      margin-bottom: 20px;
    }
    .header-add-btn-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    .header-add-btn {
      cursor: pointer;
      padding: 8px 0;
      background-color: #dcdcdc;
      color: #000;
      border-radius: 4px;
      text-align: center;
      width: 120px;
      box-sizing: border-box;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.4);
    }
    .modal-content {
      background-color: #fefefe;
      margin: 15% auto;
      padding: 15px;
      border: 1px solid #888;
      width: 80%;
      max-width: 400px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      border-radius: 8px;
    }
    .close, .close-executor {
      color: #aaa;
      float: right;
      font-size: 24px;
      font-weight: bold;
    }
    .close:hover, .close:focus, .close-executor:hover, .close-executor:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
    }
    .form-group select, .form-group input {
      width: calc(100% - 16px);
      padding: 6px;
      box-sizing: border-box;
    }
  </style>  
</head>
<body>
  <div class="search-container">
    <div class="search-item">
      <select id="testgroupSelect" class="layui-select" aria-label="选择测试组">
        <option value="">请选择测试组</option>
        <option value="路由">路由</option>
        <option value="交换">交换</option>
        <option value="安全">安全</option>
      </select>
    </div>
    <div class="search-item">
      <select id="projectlevelSelect" class="layui-select" aria-label="选择项目级别">
        <option value="">请选择项目级别</option>
        <option value="重要">重要</option>
        <option value="普通">普通</option>
      </select>
    </div>
    <div class="search-item">
      <select id="projectstatusSelect" class="layui-select" aria-label="选择项目状态">
        <option value="">请选择项目状态</option>
        <option value="进行中">进行中</option>
        <option value="已完成">已完成</option>
      </select>
    </div>
    <div class="search-item">
      <input type="text" id="projectnameInput" placeholder="请输入项目名" class="layui-input" aria-label="项目名">
    </div>
    <div class="search-item">
      <button id="searchBtn" class="layui-btn layui-btn-primary">搜索</button>
    </div>
    <div class="search-item">
      <button id="resetBtn" class="layui-btn layui-btn-primary">重置</button>
    </div>
  </div>

  <table id="projectboard" lay-filter="projectboard"></table>

  <div id="myModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <span class="close" aria-label="关闭">&times;</span>
      <h3>新增项目</h3>
      <form id="addForm">
        <div class="form-group">
          <label for="modalTestgroup">测试组:</label>
          <select id="modalTestgroup" required>
            <option value="">请选择测试组</option>
            <option value="路由">路由</option>
            <option value="交换">交换</option>
            <option value="安全">安全</option>
          </select>
        </div>
        <div class="form-group">
          <label for="modalProjectname">项目名:</label>
          <input type="text" id="modalProjectname" required>
        </div>
        <div class="form-group">
          <label for="modalConversionFactor">项目系数:</label>
          <input type="number" id="modalConversionFactor" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="modalProjectlevel">项目级别:</label>
          <select id="modalProjectlevel" required>
            <option value="">请选择项目级别</option>
            <option value="重要">重要</option>
            <option value="普通">普通</option>
          </select>
        </div>
        <div class="form-group">
          <label for="modalHeadcounts">测试人数:</label>
          <input type="number" id="modalHeadcounts" required>
        </div>
        <div class="form-group">
          <label for="modalExpectnum">预期问题总数:</label>
          <input type="number" id="modalExpectnum" required>
        </div>
        <div class="form-group">
          <label for="modalExpectdi">预期总DI:</label>
          <input type="number" id="modalExpectdi" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="modalExpectavnum">预期问题均数:</label>
          <input type="number" id="modalExpectavnum" required>
        </div>
        <div class="form-group">
          <label for="modalExpectavdi">预期DI均值:</label>
          <input type="number" id="modalExpectavdi" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="modalStartime">开始日期:</label>
          <input type="date" id="modalStartime" required>
        </div>
        <button type="submit" style="margin-top: 10px;">提交</button>
      </form>
    </div>
  </div>

  <!-- Executor Modal -->
  <div id="executorModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <span class="close-executor" aria-label="关闭执行人窗口">&times;</span>
      <h3>新增执行人</h3>
      <form id="addExecutorForm">
        <div class="form-group">
          <label for="modalExecutorName">执行人姓名:</label>
          <input type="text" id="modalExecutorName" required>
        </div>
        <div class="form-group">
          <label for="modalExecutorExpectedIssues">预期问题数:</label>
          <input type="number" id="modalExecutorExpectedIssues" required>
        </div>
        <div class="form-group">
          <label for="modalExecutorExpectedDI">预期DI:</label>
          <input type="number" id="modalExecutorExpectedDI" step="0.01" required>
        </div>
        <input type="hidden" id="modalProjectID">
        <button type="submit" style="margin-top: 10px;">提交</button>
      </form>
    </div>
  </div>

  <!-- 引入 jQuery 和 LayUI -->
  <script src="{{ url_for('static', filename='jquery-3.6.0.min.js') }}"></script>
  <script src="{{ url_for('static', filename='src/layui.js') }}"></script>
  <!-- 引入自定义脚本 -->
  <script>
    $(document).ready(function() {
      layui.use(['table', 'laydate', 'layer'], function() {
        var table = layui.table;
        var laydate = layui.laydate;
        var layer = layui.layer;

        function fetchDataAndRenderTable() {
          $.ajax({
            url: '/projects',
            method: 'GET',
            success: function(data) {
              if (Array.isArray(data) && data.length > 0) {
                renderTable(data);
              } else {
                console.error('Data format is incorrect or empty');
                layer.msg('数据库中尚未添加数据', { icon: 2, time: 2000 });
                renderTable([]);
              }
            },
            error: function() {
              layer.msg('Failed to fetch data from server', { icon: 2, time: 2000 });
              renderTable([]);
            }
          });
        }
        
        function renderTable(data) {
          table.render({
            elem: '#projectboard',
            data: data,
            cols: [[
              {field: 'expand', title: '<div class="header-add-btn-container"><div class="header-add-btn" id="addBtn">新增项目</div></div>', width: 120, templet: function(){
                return '<div class="expand-btn layui-icon layui-icon-right"></div>';
              }},
              {field: 'TestGroup', title: '测试组', width: 90, sort: true},
              {field: 'ProjectName', title: '项目名', width: 300},
              {field: 'ConversionFactor', title: '系数', width: 60},
              {field: 'ProjectLevel', title: '级别', width: 70},
              {field: 'HeadCounts', title: '测试人数', width: 90},
              {field: 'ExpectedIssues', title: '预期问题总数', width: 120},
              {field: 'ExpectedDI', title: '预期总DI', width: 100},
              {field: 'ExpectedAverageIssues', title: '预期问题均数', width: 120},
              {field: 'ExpectedAverageDI', title: '预期DI均值', width: 100},
              {field: 'StartDate', title: '开始日期', width: 120},
              {field: 'Status', title: '项目状态', width: 90},
              {field: 'operations', title: '操作', width: 180, templet: function(){
                return '<button class="layui-btn layui-btn-danger layui-btn-xs delete-btn">删除</button>' +
                       '<button class="layui-btn layui-btn-normal layui-btn-xs add-executor-btn">新增执行人</button>';
              }}
            ]]
          });

          // Event delegation for delete and add executor buttons
          $('.layui-table-body').on('click', '.delete-btn', function() {
            var index = $(this).closest('tr').data('index');
            var rowData = data[index];
            layer.confirm('删除操作不能恢复，请确认是否删除？', { icon: 3, title: '确认删除' }, function(index) {
              $.ajax({
                url: '/delete_project',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ id: rowData.ID }),
                success: function() {
                  layer.msg('项目已删除', { icon: 1, time: 2000 });
                  fetchDataAndRenderTable();
                },
                error: function() {
                  layer.msg('删除项目失败', { icon: 2, time: 2000 });
                }
              });
              layer.close(index);
            });
          });

          $('.layui-table-body').on('click', '.add-executor-btn', function() {
            var index = $(this).closest('tr').data('index');
            var rowData = data[index];
            $('#modalProjectID').val(rowData.ID);
            $('#executorModal').show();
          });

          // Expand child table
          $('.layui-table-body').on('click', '.expand-btn', function() {
            var tr = $(this).closest('tr');
            var dataIndex = tr.attr('data-index');
            var rowData = data[dataIndex];

            if (tr.next().hasClass('expand-row')) {
              tr.next().remove();
              $(this).removeClass('layui-icon-down').addClass('layui-icon-right');
            } else {
              $.ajax({
                url: `/executors/${rowData.ID}`,
                method: 'GET',
                success: function(executors) {
                  if (executors.length === 0) {
                    layer.msg('请给项目添加执行人', { icon: 0, time: 2000 });
                    return;
                  }

                  var executorRows = executors.map(function(executor) {
                    return `<tr>
                              <td style="width: 100px; border: 1px solid #ddd; padding: 8px;">${executor.ExecutorName}</td>
                              <td style="width: 90px; border: 1px solid #ddd; padding: 8px;">${executor.ExpectedIssues}</td>
                              <td style="width: 90px; border: 1px solid #ddd; padding: 8px;">${executor.ExpectedDI}</td>
                              <td style="width: 70px; border: 1px solid #ddd; padding: 8px;">
                                  <button class="layui-btn layui-btn-danger layui-btn-xs executor-delete-btn" data-executor-id="${executor.ID}">删除</button>
                              </td>
                            </tr>`;
                  }).join('');

                  var newRow = $('<tr class="expand-row"><td colspan="13"><div style="padding: 20px; background-color: #f2f2f2;"><table style="width: 100%; border-collapse: collapse; border: 1px solid #ddd;"><thead><tr><th style="width: 100px; border: 1px solid #ddd; padding: 8px;">执行人</th><th style="width: 90px; border: 1px solid #ddd; padding: 8px;">预期问题数</th><th style="width: 90px; border: 1px solid #ddd; padding: 8px;">预期DI</th><th style="width: 70px; border: 1px solid #ddd; padding: 8px;">操作</th></tr></thead><tbody>' + executorRows + '</tbody></table></div></td></tr>');
                  tr.after(newRow);
                  $(this).removeClass('layui-icon-right').addClass('layui-icon-down');
                },
                error: function(xhr) {
                  if (xhr.status === 404) {
                    layer.msg('请给项目添加执行人', { icon: 0, time: 2000 });
                  } else {
                    layer.msg('获取执行人信息失败', { icon: 2, time: 2000 });
                  }
                }
              });
            }
          });

          // Delete executor
          $(document).off('click', '.executor-delete-btn').on('click', '.executor-delete-btn', function() {
            var executorId = $(this).data('executor-id');
            layer.confirm('删除操作不能恢复，请确认是否删除？', { icon: 3, title: '确认删除' }, function(index) {
              $.ajax({
                url: '/delete_executor',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ id: executorId }),
                success: function() {
                  layer.msg('执行人已删除', { icon: 1, time: 2000 });
                  fetchDataAndRenderTable();
                },
                error: function() {
                  layer.msg('删除执行人失败', { icon: 2, time: 2000 });
                }
              });
              layer.close(index);
            });
          });
        }

        $('#addForm').on('submit', function(event) {
          event.preventDefault();
          var formData = {
            testgroup: $('#modalTestgroup').val(),
            projectname: $('#modalProjectname').val(),
            conversionFactor: $('#modalConversionFactor').val(),
            projectlevel: $('#modalProjectlevel').val(),
            headcounts: parseInt($('#modalHeadcounts').val(), 10),
            expectedissues: parseInt($('#modalExpectnum').val(), 10),
            expecteddi: $('#modalExpectdi').val(),
            expectedaverageissues: parseInt($('#modalExpectavnum').val(), 10),
            expectedaveragedi: $('#modalExpectavdi').val(),
            startdate: $('#modalStartime').val()
          };

          $.ajax({
            url: '/add_project',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(formData),
            success: function() {
              $('#myModal').hide();
              fetchDataAndRenderTable();
              layer.msg('项目已成功添加', { icon: 1, time: 2000 });
            },
            error: function(xhr) {
              if (xhr.status === 409) {
                // If the error is due to a duplicate project name
                layer.msg('项目名称已存在，请输入不同的名称', { icon: 0, time: 3000 });
              } else {
                layer.msg('添加项目失败，请重试', { icon: 2, time: 2000 });
              }
            }
          });
        });


        $('#addExecutorForm').on('submit', function(event) {
          event.preventDefault();
          var executorData = {
            executorName: $('#modalExecutorName').val().trim(),
            expectedIssues: parseInt($('#modalExecutorExpectedIssues').val().trim(), 10),
            expectedDI: parseFloat($('#modalExecutorExpectedDI').val().trim()),
            projectID: parseInt($('#modalProjectID').val().trim(), 10)
          };

          $.ajax({
            url: '/add_executor',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(executorData),
            success: function() {
              $('#executorModal').hide();
              fetchDataAndRenderTable();
              layer.msg('执行人已成功添加', { icon: 1, time: 2000 });
            },
            error: function(xhr) {
              if (xhr.status === 409) {
                // 如果状态码是 409，表示执行人已存在
                layer.msg('执行人已存在，请输入不同的姓名', { icon: 0, time: 3000 });
              } else {
                layer.msg('添加执行人失败，请重试', { icon: 2, time: 2000 });
              }
            }
          });
        });

        $('#searchBtn').on('click', function() {
          var searchParams = {
            testgroup: $('#testgroupSelect').val(),
            projectlevel: $('#projectlevelSelect').val(),
            projectstatus: $('#projectstatusSelect').val(),
            projectname: $('#projectnameInput').val()
          };

          $.ajax({
            url: '/search_projects',
            method: 'GET',
            data: searchParams,
            success: function(data) {
              renderTable(data);
            },
            error: function() {
              layer.msg('搜索失败，请重试', { icon: 2, time: 2000 });
            }
          });
        });

        $('#resetBtn').on('click', function() {
          $('#testgroupSelect').val('');
          $('#projectlevelSelect').val('');
          $('#projectnameInput').val('');
          $('#projectstatusSelect').val('');
          fetchDataAndRenderTable();
        });

        $(document).on('click', '#addBtn', function() {
          $('#myModal').show();
        });

        $('.close').on('click', function() {
          $('#myModal').hide();
        });

        $('.close-executor').on('click', function() {
          $('#executorModal').hide();
        });

        fetchDataAndRenderTable();
      });
    });
  </script>
</body>
</html>
